<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生签到系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>学生签到系统</h1>
            <div class="stats">
                <span class="stat-item">总人数: <span id="total-count">0</span></span>
                <span class="stat-item">已签到: <span id="signed-count">0</span></span>
                <span class="stat-item">已完成: <span id="signed-out-count">0</span></span>
                <span class="stat-item">未签到: <span id="unsigned-count">0</span></span>
            </div>
        </header>
        
        <div class="activity-selector-bar" id="activity-selector">
            <!-- 活动选择器将通过JavaScript动态生成 -->
        </div>
        
        <div class="date-selector-bar" id="date-selector">
            <!-- 日期选择按钮将通过JavaScript动态生成 -->
        </div>
        
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="signed">已签到</button>
            <button class="filter-btn" data-filter="unsigned">未签到</button>
            <button class="history-btn" onclick="showHistoryModal()">签到历史</button>
            <button class="settings-btn" onclick="showTimeLimitsModal()">时间设置</button>
            <button class="reset-btn" onclick="handleReset()">重置签到</button>
        </div>
        
        <div class="students-grid" id="students-grid">
            <!-- 学生卡片将通过JavaScript动态生成 -->
        </div>
    </div>
    
    <script src="students.js"></script>
    <script src="app.js"></script>
</body>
</html>
